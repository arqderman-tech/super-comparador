name: SuperComparador Daily Scraper & Cloud Sync

on:
  schedule:
    # Ejecuta automáticamente todos los días a las 08:17 UTC (05:17 AM hora argentina)
    - cron: '17 8 * * *'
  workflow_dispatch: # Permite ejecutar manualmente con un clic desde la web de GitHub

# Permisos para actualizar el repositorio y publicar en GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-laanonima-pi:
    name: 🛒 Relevar La Anónima (Raspberry Pi Rosario)
    runs-on: [self-hosted, Linux]
    timeout-minutes: 25
    continue-on-error: true # Si la Pi está apagada o sin internet, no detiene el workflow general

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Instalar dependencias para La Anónima
        run: |
          python3 -m pip install --upgrade pip --break-system-packages 2>/dev/null || python3 -m pip install --upgrade pip || true
          python3 -m pip install requests beautifulsoup4 curl_cffi --break-system-packages 2>/dev/null || python3 -m pip install requests beautifulsoup4 curl_cffi || true

      - name: 🧩 Ensamblar base de datos SQLite
        run: |
          python3 db_split.py ensure

      - name: 🌐 Asegurar Cloudflare WARP y detectar salida (auto)
        id: warp
        env:
          # Si definís la variable de repositorio LAANONIMA_PROXY, tiene prioridad.
          # Si no, se autodetecta el proxy local de WARP en 127.0.0.1:40000.
          REPO_PROXY: ${{ vars.LAANONIMA_PROXY }}
        run: |
          # 1) Best-effort: reconectar WARP si la Pi lo tiene (no rompe el job si no hay permisos).
          if command -v warp-cli >/dev/null 2>&1; then
            sudo -n warp-cli --accept-tos connect 2>/dev/null || warp-cli --accept-tos connect 2>/dev/null || true
            sleep 3
          fi

          # 2) Determinar proxy: variable del repo > autodetección del proxy WARP local.
          #    Si WARP está en modo túnel completo no hay proxy y el tráfico ya sale por Cloudflare.
          proxy="$REPO_PROXY"
          if [ -z "$proxy" ] && command -v curl >/dev/null 2>&1; then
            if curl -s --max-time 8 -x http://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then
              proxy="http://127.0.0.1:40000"
            fi
          fi

          if [ -n "$proxy" ]; then
            echo "✅ La Anónima saldrá por proxy WARP: $proxy"
          else
            echo "::warning title=WARP no detectado::No hay proxy WARP operativo en 127.0.0.1:40000; se saldrá por la IP directa del host (riesgo de HTTP 403)."
          fi
          echo "proxy=$proxy" >> "$GITHUB_OUTPUT"

      - name: 🛒 Ejecutar Scraper de La Anónima (IP Residencial)
        id: laanonima_scraper
        env:
          LAANONIMA_PROXY: ${{ steps.warp.outputs.proxy }}
        run: |
          python3 scraper_laanonima.py

      - name: 🧩 Particionar base completa para GitHub (<100MB por bloque)
        if: steps.laanonima_scraper.outcome == 'success'
        run: |
          python3 db_split.py split

      - name: 💾 Guardar y sincronizar avance de La Anónima
        if: steps.laanonima_scraper.outcome == 'success'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database.db.part*
          if git diff --staged --quiet; then
            echo "::warning title=La Anónima sin cambios::No hubo cambios para commitear (catalogo identico al previo o sin datos nuevos)."
          else
            git commit -m "chore(auto): actualización diaria La Anónima desde Raspberry Pi [skip ci]"
            git push
          fi

  scrape-cloud-and-deploy:
    name: ☁️ Relevar Multitienda Cloud y Desplegar Web
    needs: scrape-laanonima-pi
    if: always() # Se ejecuta siempre, incluso si la Pi fallara o estuviera apagada
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 🧩 Ensamblar base de datos SQLite
        run: |
          python db_split.py ensure

      - name: 📈 Actualizar historial de precios de GALLEBOT
        run: |
          python update_history.py || echo "Aviso en update_history.py"

      - name: 🛒 Ejecutar Scrapers de Supermercados Cloud
        run: |
          echo "Ejecutando relevamiento de precios multitienda..."
          python scraper.py || echo "Aviso La Gallega"
          python carrefour_scraper.py || echo "Aviso Carrefour Scraper"
          python import_carrefour.py || echo "Aviso Import Carrefour"
          python scraper_coto.py || echo "Aviso COTO"
          python scraper_jumbo.py || echo "Aviso Jumbo"
          python scraper_reina.py || echo "Aviso La Reina"

      - name: 🌐 Generar datos estáticos para GitHub Pages
        run: |
          python export_static_data.py

      - name: 🧩 Particionar base completa para GitHub (<100MB por bloque)
        run: |
          python db_split.py split

      - name: 💾 Guardar y comitear datos actualizados en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database.db.part* static/data/
          git diff --staged --quiet || (git commit -m "chore(auto): actualización diaria de precios [skip ci]" && git push)

      - name: 🚀 Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📦 Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './static'

      - name: 🌍 Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
